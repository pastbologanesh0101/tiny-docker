[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinydocker"
version = "0.1.0"
description = "A minimal container runtime from scratch: Linux namespaces + cgroups v2 + pivot_root, plus a stdlib-only Docker Hub image puller"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vishwanathan Tamizharasan" }]
keywords = ["containers", "linux", "namespaces", "cgroups", "pivot-root", "docker", "runtime", "oci"]

[project.scripts]
tinydocker = "tinydocker.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["tinydocker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
