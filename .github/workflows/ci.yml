name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # unit tests are cross-platform; container tests skip on non-Linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  containers:
    # the real thing: namespaces, pivot_root, /proc, cgroups on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y busybox-static
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pip install -e ".[dev]"
      - run: pytest -q -v
      - run: bash examples/demo.sh
